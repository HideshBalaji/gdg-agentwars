[project]
name = "ghost-dispatcher"
version = "0.1.0"
description = "Self-healing multi-agent cold-chain incident handler built on Google ADK + Gemini (GDG Agent Wars)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.12",
  "mcp>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_dispatcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
